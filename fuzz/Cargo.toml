[package]
name = "kurla-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[package.metadata.vet]
store = { path = "../supply-chain" }

[workspace]

[dependencies]
libfuzzer-sys = "=0.4.13"
kurla = { path = "..", version = "=0.1.0" }

[[bin]]
name = "png"
path = "fuzz_targets/png.rs"
test = false
doc = false
bench = false

