    "src/unicode/scan.rs",
    "src/unicode/context.rs",
    "src/text.rs",
    "src/markup.rs",
    "src/svg.rs",
    "src/binary/*.rs",
    "src/encoded.rs",
    "src/aimed.rs",
    "src/agent_files.rs",
    "src/location.rs",
